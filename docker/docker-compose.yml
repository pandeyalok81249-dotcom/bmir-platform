version: '3.8'

services:
  # 1. PostgreSQL with pgvector for Relational Data & Semantic RAG Embeddings
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bmir-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bmir_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-BmirSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-bmir_ecosystem}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bmir_admin} -d ${POSTGRES_DB:-bmir_ecosystem}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis for Session Caching & Task Coordination
  redis:
    image: redis:7-alpine
    container_name: bmir-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend Services
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bmir-backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-bmir_admin}:${POSTGRES_PASSWORD:-BmirSecurePass2026!}@postgres:5432/${POSTGRES_DB:-bmir_ecosystem}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-bmir-enterprise-secure-production-secret-key-2026}
      - FOUNDER_NAME=Binod Pandey
      - FOUNDER_EMAIL=binod.pandey@bmirresearch.in
      - ADMIN_EMAIL=admin@bmirresearch.in
      - DEFAULT_INITIAL_PASSWORD=${DEFAULT_INITIAL_PASSWORD:-Bmir@2026!Enterprise}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  # 4. Next.js Enterprise Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bmir-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
