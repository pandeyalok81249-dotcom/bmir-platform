version: '3.8'

networks:
  career_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_intel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-resume_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - career_network

  redis:
    image: redis:7-alpine
    container_name: resume_intel_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - career_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: resume_intel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/${POSTGRES_DB:-resume_intelligence}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379/0
      ENVIRONMENT: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-resume-intelligence-super-secure-production-secret-key-64-characters}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PREFERRED_AI_PROVIDER: ${PREFERRED_AI_PROVIDER:-gemini}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../backend/uploads:/app/uploads
    networks:
      - career_network
